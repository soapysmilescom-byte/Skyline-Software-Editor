<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" fill="none">
  <defs>
    <linearGradient id="skyCloud" x1="20" y1="20" x2="145" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A2259" />
      <stop offset="50%" stop-color="#0066E6" />
      <stop offset="100%" stop-color="#00B2FF" />
    </linearGradient>
    <linearGradient id="skySwoosh" x1="12" y1="108" x2="148" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06173D" />
      <stop offset="55%" stop-color="#004EC4" />
      <stop offset="100%" stop-color="#00B4FF" />
    </linearGradient>
    <linearGradient id="towerBright" x1="65" y1="14" x2="65" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B2FF" />
      <stop offset="55%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#081C47" />
    </linearGradient>
    <linearGradient id="towerDark" x1="40" y1="30" x2="120" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0044AA" />
      <stop offset="100%" stop-color="#07183B" />
    </linearGradient>
    <radialGradient id="baseGlow" cx="50%" cy="82%" r="48%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00A3FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Crisp Rounded Card Backdrop -->
  <rect width="420" height="140" rx="22" fill="#F7F8FB" />

  <!-- Subtle Base Glow Behind Buildings -->
  <ellipse cx="78" cy="96" rx="52" ry="18" fill="url(#baseGlow)" />

  <!-- Cloud Outline Crest -->
  <path
    d="M27 78C21 71 21 60 28 53C33 48 40 46 46 47C50 32 64 22 80 22C94 22 106 29 113 40C125 40 135 50 135 62C135 68 132 74 128 78"
    stroke="url(#skyCloud)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Tower 1 (Far Left) -->
  <path d="M30 96V64L38 58V96H30Z" fill="url(#towerDark)" />

  <!-- Tower 2 (Left Slanted + Window Stripes) -->
  <path d="M41 96V48L53 41V96H41Z" fill="url(#towerBright)" />
  <path d="M53 41L61 45V96H53V41Z" fill="#06193F" />
  <g fill="#38BDF8" fill-opacity="0.85">
    <rect x="54.5" y="49" width="5" height="2" rx="0.5" />
    <rect x="54.5" y="54" width="5" height="2" rx="0.5" />
    <rect x="54.5" y="59" width="5" height="2" rx="0.5" />
    <rect x="54.5" y="64" width="5" height="2" rx="0.5" />
    <rect x="54.5" y="69" width="5" height="2" rx="0.5" />
    <rect x="54.5" y="74" width="5" height="2" rx="0.5" />
    <rect x="54.5" y="79" width="5" height="2" rx="0.5" />
  </g>

  <!-- Tower 3 (Center Spire Skyscraper) -->
  <path d="M64 96V35L76 26V96H64Z" fill="url(#towerBright)" />
  <path d="M76 26L84 32V96H76V26Z" fill="#051638" />
  <polygon points="76,8 78.2,27 73.8,27" fill="#00A6FF" />

  <!-- Tower 4 (Mid Right) -->
  <path d="M87 96V41L99 45V96H87Z" fill="url(#towerDark)" />
  <rect x="89.5" y="50" width="2" height="32" rx="1" fill="#00A3FF" fill-opacity="0.55" />

  <!-- Tower 5 (Far Right Slanted + Window Stripes) -->
  <path d="M103 94V53L116 59V91H103Z" fill="url(#towerBright)" />
  <g fill="#BAE6FD" fill-opacity="0.8">
    <rect x="106" y="61" width="7" height="2" rx="0.5" />
    <rect x="106" y="66" width="7" height="2" rx="0.5" />
    <rect x="106" y="71" width="7" height="2" rx="0.5" />
    <rect x="106" y="76" width="7" height="2" rx="0.5" />
  </g>

  <!-- Sweeping Crescent Swoosh Arc -->
  <path
    d="M16 95C16 105 34 114 68 106C101 98 130 78 138 52C140 69 124 94 94 108C58 124 14 118 16 95Z"
    fill="url(#skySwoosh)"
  />

  <!-- Skyline Wordmark -->
  <text
    x="156"
    y="78"
    fill="#071B3B"
    font-family="Plus Jakarta Sans, Arial, sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="-1.5"
  >
    Skyline
  </text>
  <!-- Cyan Square Dot Over 'i' -->
  <rect x="255" y="34" width="9" height="9" rx="1.5" fill="#00A6FF" />

  <!-- TM Mark -->
  <text
    x="375"
    y="46"
    fill="#071B3B"
    font-family="Plus Jakarta Sans, Arial, sans-serif"
    font-size="11"
    font-weight="700"
  >
    TM
  </text>

  <!-- SOFTWARE Subtitle with Flanking Hairlines -->
  <line x1="160" y1="98" x2="200" y2="98" stroke="#1E3A5F" stroke-width="1.5" />
  <text
    x="269"
    y="102"
    text-anchor="middle"
    fill="#1E3A5F"
    font-family="Plus Jakarta Sans, Arial, sans-serif"
    font-size="13.5"
    font-weight="700"
    letter-spacing="6"
  >
    SOFTWARE
  </text>
  <line x1="338" y1="98" x2="378" y2="98" stroke="#1E3A5F" stroke-width="1.5" />
</svg>
